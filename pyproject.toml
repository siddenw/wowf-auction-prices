[project]
name = "wowf-auction-prices"
version = "0.1.0"
description = "Find the best WoW Forever auction house price for an item, live from the Blizzard API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
]

[project.scripts]
wowf = "wowf.cli:main"
wowf-site = "wowf.site:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowf"]
