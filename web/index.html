<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoW Forever AH Prices</title>
<meta name="description" content="Cheapest WoW Forever auction house for any item, including the flight to get there. Updated hourly.">
<meta property="og:title" content="WoW Forever AH Prices">
<meta property="og:description" content="Cheapest auction house for any item, including the flight to get there. Updated hourly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e8b923'/><text x='16' y='22' font-size='16' text-anchor='middle' font-family='Georgia' font-weight='bold' fill='%23402a00'>g</text></svg>">
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --fg: #1d1b18; --muted: #6b665d; --line: #e4e0d6;
  --accent: #a8740a; --accent-bg: #fbf1d8; --good: #1d7a3a; --good-bg: #e3f4e8; --warn: #9a5b00;
  --gold: #a8740a; --silver: #6c7480; --copper: #a25a2a;
  --qP: #8a8a8a; --qC: #1d1b18; --qU: #1f8a0f; --qR: #0062c4; --qE: #8a2fd0; --qL: #c46200; --qA: #b09640; --qH: #2f8fc4;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131210; --card: #1d1b18; --fg: #ece8df; --muted: #9a948a; --line: #2f2c27;
    --accent: #e8b923; --accent-bg: #2d2610; --good: #5fd27e; --good-bg: #16301e; --warn: #f0b04a;
    --gold: #f0c94a; --silver: #c3cad3; --copper: #d98a52;
    --qP: #9d9d9d; --qC: #ece8df; --qU: #1eff00; --qR: #3d9bff; --qE: #b86df5; --qL: #ff8000; --qA: #e6cc80; --qH: #5fc3ff;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #131210; --card: #1d1b18; --fg: #ece8df; --muted: #9a948a; --line: #2f2c27;
  --accent: #e8b923; --accent-bg: #2d2610; --good: #5fd27e; --good-bg: #16301e; --warn: #f0b04a;
  --gold: #f0c94a; --silver: #c3cad3; --copper: #d98a52;
  --qP: #9d9d9d; --qC: #ece8df; --qU: #1eff00; --qR: #3d9bff; --qE: #b86df5; --qL: #ff8000; --qA: #e6cc80; --qH: #5fc3ff;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(12px, env(safe-area-inset-top)) 16px 48px;
}
main { max-width: 680px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin: 4px 0 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
h1 span { color: var(--accent); }
.fresh { color: var(--muted); font-size: 12px; white-space: nowrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.settings .wide { grid-column: 1 / -1; }
select, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--bg); color: var(--fg); font: inherit; padding: 9px 4px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary { margin-bottom: 10px; }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
.tabs button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.searchrow { display: flex; gap: 8px; position: relative; }
.searchrow input[type=search] { flex: 1; font-size: 16px; padding: 12px 12px; }
.searchrow input.qty { width: 74px; flex: none; text-align: center; font-size: 16px; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); overflow: hidden; display: none; }
.sugg.open { display: block; }
.sugg button { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 10px 12px; cursor: pointer; }
.sugg button + button { border-top: 1px solid var(--line); }
.sugg button.act, .sugg button:hover { background: var(--accent-bg); }
.sugg .p { color: var(--muted); white-space: nowrap; font-size: 13px; }
.item-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.item-title h2 { font-size: 18px; margin: 0; }
.item-title .id { color: var(--muted); font-size: 12px; font-weight: 400; }
.iconbtn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.houses { display: flex; flex-direction: column; gap: 8px; }
.house { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.house.best { border-color: var(--good); background: var(--good-bg); }
.house.none { opacity: .55; }
.house .name { font-weight: 600; }
.house .total { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.house .sub { color: var(--muted); font-size: 13px; }
.house .sub.r { text-align: right; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--good); margin-left: 6px; letter-spacing: .02em; }
.verdict { margin: 12px 2px 2px; }
.verdict.good b { color: var(--good); }
.route { color: var(--muted); font-size: 13px; margin: 4px 2px 0; }
.note { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }
.warn { color: var(--warn); }
.g { color: var(--gold); } .s { color: var(--silver); } .c { color: var(--copper); }
.money { font-variant-numeric: tabular-nums; white-space: nowrap; }
.q-P { color: var(--qP); } .q-C { color: var(--qC); } .q-U { color: var(--qU); } .q-R { color: var(--qR); }
.q-E { color: var(--qE); } .q-L { color: var(--qL); } .q-A { color: var(--qA); } .q-H { color: var(--qH); }
.list-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row input { width: 70px; text-align: center; padding: 6px; }
.list-row .x { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
.stop { margin-top: 10px; }
.stop h3 { font-size: 14px; margin: 0 0 4px; }
.stop .line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; }
.empty { color: var(--muted); text-align: center; padding: 18px 0; }
details.vendors { margin: 10px 2px 0; font-size: 14px; }
details.vendors summary { cursor: pointer; }
details.vendors .vlist { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
details.vendors .vlist div { padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; }
details.vendors .where { font-variant-numeric: tabular-nums; }
details.vendors .how { color: var(--muted); }
.alts { margin-top: 10px; font-size: 13px; color: var(--muted); }
.alts div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
footer a { color: inherit; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>WoW Forever <span>AH Prices</span></h1>
    <div class="fresh" id="fresh">loading…</div>
  </header>

  <section class="card">
    <div class="settings">
      <label>Faction
        <div class="seg" id="faction">
          <button data-v="horde">Horde</button><button data-v="alliance">Alliance</button><button data-v="">Any</button>
        </div>
      </label>
      <label>Ruleset <select id="ruleset"></select></label>
      <label class="wide" id="locwrap">You are at <select id="location"></select></label>
    </div>
    <details class="more">
      <summary>Travel options ▾</summary>
      <div class="settings">
        <label>Your time is worth (gold/hour) <input id="timevalue" type="number" min="0" step="1" inputmode="numeric" placeholder="0 = ignore"></label>
        <label>After buying
          <div class="seg" id="ret"><button data-v="hearth">Hearth</button><button data-v="fly">Fly back</button></div>
        </label>
      </div>
    </details>
  </section>

  <nav class="tabs">
    <button data-tab="price" class="on">Price check</button>
    <button data-tab="list">Buy list <span id="listcount"></span></button>
  </nav>

  <section class="card">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search an item… (typos ok)" autocomplete="off" enterkeyhint="search">
      <input id="qty" class="qty" type="number" min="1" value="1" inputmode="numeric" aria-label="Quantity">
      <div class="sugg" id="sugg"></div>
    </div>
  </section>

  <section id="tab-price"><div id="result"></div></section>
  <section id="tab-list" hidden><div id="list"></div></section>

  <footer>
    Live Blizzard auction data, refreshed hourly. Flight costs from Classic Era, so Forever may differ.<br>
    Blackwater (neutral) auctioneers assumed in Booty Bay, Gadgetzan and Everlook.<br>
    Vendor data from <a href="https://github.com/cmangos/classic-db">CMaNGOS classic-db</a> (GPL-3.0).
  </footer>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
